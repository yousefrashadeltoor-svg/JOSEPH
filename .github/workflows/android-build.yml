name: ALPH Media Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "develop-alph-media-app.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alph-media-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ALPH Media Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project archive
        run: |
          test -f develop-alph-media-app.zip
          mkdir -p "$RUNNER_TEMP/alph-media"
          unzip -q develop-alph-media-app.zip -d "$RUNNER_TEMP/alph-media"
          test -f "$RUNNER_TEMP/alph-media/settings.gradle.kts"
          test -f "$RUNNER_TEMP/alph-media/app/build.gradle.kts"
          echo "Project archive extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build installable Debug APK
        working-directory: ${{ runner.temp }}/alph-media
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALPH-Media-Debug-APK
          path: ${{ runner.temp }}/alph-media/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALPH-Media-Build-Reports
          path: ${{ runner.temp }}/alph-media/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
